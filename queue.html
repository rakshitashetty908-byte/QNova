<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QNova | My Queue</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7ff;
        }

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 45px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg,#7c3aed,#4f46e5);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
        }

        .logo h2 {
            color: #5b21b6;
        }

        .back {
            text-decoration: none;
            color: #5b21b6;
            font-weight: 600;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .title p {
            color: #6b7280;
        }

        .queue-card {
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.08);
        }

        .service {
            text-align: center;
            color: #6d28d9;
            font-weight: 600;
            font-size: 17px;
            margin-bottom: 25px;
        }

        .token {
            text-align: center;
            background: linear-gradient(135deg,#7c3aed,#4f46e5);
            color: white;
            padding: 35px;
            border-radius: 20px;
            margin-bottom: 30px;
        }

        .token small {
            font-size: 15px;
        }

        .token h2 {
            font-size: 60px;
            margin-top: 8px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 18px;
        }

        .stat {
            background: #f8f7ff;
            padding: 25px 15px;
            border-radius: 16px;
            text-align: center;
        }

        .stat h3 {
            font-size: 28px;
            color: #5b21b6;
            margin-bottom: 6px;
        }

        .stat p {
            color: #6b7280;
            font-size: 13px;
        }

        .status {
            margin-top: 25px;
            padding: 18px;
            text-align: center;
            background: #ecfdf5;
            color: #047857;
            border-radius: 12px;
            font-weight: 600;
        }

        @media(max-width:600px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 0 20px;
            }

            .queue-card {
                padding: 25px;
            }

        }

    </style>

</head>

<body>

    <div class="navbar">

        <div class="logo">

            <div class="logo-box">
                Q
            </div>

            <h2>QNova</h2>

        </div>

        <a href="services.html" class="back">
            ← Services
        </a>

    </div>


    <div class="container">

        <div class="title">

            <h1>My Queue 🎫</h1>

            <p>
                Your queue information is displayed below.
            </p>

        </div>


        <div class="queue-card">

            <div class="service" id="serviceName">
                Loading service...
            </div>


            <div class="token">

                <small>Your Token Number</small>

                <h2 id="tokenNumber">
                    Q-000
                </h2>

            </div>


            <div class="stats">

                <div class="stat">

                    <h3 id="currentToken">
                        Q-012
                    </h3>

                    <p>
                        Now Serving
                    </p>

                </div>


                <div class="stat">

                    <h3 id="peopleAhead">
                        0
                    </h3>

                    <p>
                        People Ahead
                    </p>

                </div>


                <div class="stat">

                    <h3 id="waitTime">
                        0 min
                    </h3>

                    <p>
                        Estimated Wait
                    </p>

                </div>

            </div>


            <div class="status">
                🟢 You are successfully in the queue
            </div>

        </div>

    </div>


    <script>

        // Get saved information
        const service =
            localStorage.getItem("qNovaService");

        const token =
            localStorage.getItem("qNovaToken");

        const currentToken =
            localStorage.getItem("qNovaCurrentToken");

        const peopleAhead =
            localStorage.getItem("qNovaPeopleAhead");

        const waitTime =
            localStorage.getItem("qNovaWaitTime");


        // Display information
        document.getElementById("serviceName").textContent =
            service || "No service selected";

        document.getElementById("tokenNumber").textContent =
            token || "Q-000";

        document.getElementById("currentToken").textContent =
            currentToken || "Q-012";

        document.getElementById("peopleAhead").textContent =
            peopleAhead || "0";

        document.getElementById("waitTime").textContent =
            (waitTime || "0") + " min";

    </script>

</body>
</html>
