<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QNova | Profile</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="brand">
<div class="logo small">Q</div>
<div>
<h2>QNova</h2>
<small>Smart Queue</small>
</div>
</div>

<nav>
<a href="dashboard.html">🏠 Dashboard</a>
<a href="queue.html">🎫 My Queue</a>
<a href="services.html">🏢 Services</a>
<a href="notifications.html">🔔 Notifications</a>
<a class="active" href="profile.html">👤 Profile</a>
<a href="about.html">ℹ️ About QNova</a>
</nav>

<div class="sidebar-bottom">
<button onclick="logoutUser()" class="logout-btn">🚪 Logout</button>
</div>

</aside>

<main class="main">

<header class="topbar">
<div>
<h1>My Profile 👤</h1>
<p class="muted">Manage your account information</p>
</div>
</header>

<section class="profile-card">

<div class="profile-avatar">R</div>

<h2 id="profileName">QNova User</h2>
<p id="profileEmail">user@example.com</p>

<div class="profile-details">

<div>
<label>Full Name</label>
<input id="profileNameInput" type="text" value="QNova User">
</div>

<div>
<label>Email</label>
<input id="profileEmailInput" type="email" value="user@example.com">
</div>

<div>
<label>Phone</label>
<input type="text" placeholder="Enter phone number">
</div>

<div>
<label>Preferred Service</label>
<select>
<option>General Service</option>
<option>Banking</option>
<option>Hospital</option>
<option>College Office</option>
</select>
</div>

</div>

<button class="primary-btn" onclick="saveProfile()">
Save Changes
</button>

</section>

</main>
</div>

<script src="script.js"></script>
</body>
</html>
